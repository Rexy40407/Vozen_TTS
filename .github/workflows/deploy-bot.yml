# Auto-deploy of the Rust runtime to the production VPS. The checkout and
# persistent SQLite database live in ~/vozen-rust-prod; the legacy Node service
# must stay stopped.
name: Deploy bot to VPS

on:
  # Deployment starts only after the complete CI workflow succeeds on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # This action receives the production SSH key, so it is pinned to a commit.
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            cd ~/vozen-rust-prod
            # The production clone was originally created as a single-branch
            # checkout, so fetch main explicitly instead of relying on its
            # persisted remote refspec.
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            current_commit="$(git rev-parse HEAD)"
            target_commit="$(git rev-parse origin/main)"
            if [ "$current_commit" = "$target_commit" ]; then
              echo "Production already runs $target_commit"
              exit 0
            fi
            git reset --hard origin/main
            bash scripts/deploy-rust-vps.sh
