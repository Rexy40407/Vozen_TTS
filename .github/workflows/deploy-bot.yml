# Auto-deploy of the Rust runtime to the production VPS. The checkout and
# persistent SQLite database live in ~/vozen-rust-prod; the legacy Node service
# must stay stopped.
name: Deploy bot to VPS

on:
  # Production is intentionally released from the Rust migration branch. The old
  # main checkout is not the production source of truth.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [migration/vozen-rust]
  workflow_dispatch:
    inputs:
      production_sha:
        description: 'Exact CI-tested migration/vozen-rust commit to deploy'
        required: true
        type: string

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Validate VPS deploy inputs
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || { echo "::error title=Missing VPS_HOST::Add the VPS_HOST repository secret."; exit 1; }
          test -n "$VPS_USER" || { echo "::error title=Missing VPS_USER::Add the VPS_USER repository secret."; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "::error title=Missing VPS_SSH_KEY::Add the VPS_SSH_KEY repository secret."; exit 1; }

      # This action receives the production SSH key, so it is pinned to a commit.
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PLUS_MONTHLY: price_1TxsU9QFJYeD1Af0C1HtEWWE
          STRIPE_PRICE_PLUS_YEARLY: price_1TxsXSQFJYeD1Af0B2o7xYKq
          STRIPE_PRICE_PREMIUM_MONTHLY: price_1TxsdeQFJYeD1Af0ujsKbFde
          STRIPE_PRICE_PREMIUM_YEARLY: price_1Txsk7QFJYeD1Af0GipTrZTd
          STRIPE_PRICE_MAX_MONTHLY: price_1Txsp7QFJYeD1Af0LVQvo30q
          STRIPE_PRICE_MAX_YEARLY: price_1TxspPQFJYeD1Af0EG6lUKIl
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.production_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: STRIPE_SECRET_KEY,STRIPE_PUBLISHABLE_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_PRICE_PLUS_MONTHLY,STRIPE_PRICE_PLUS_YEARLY,STRIPE_PRICE_PREMIUM_MONTHLY,STRIPE_PRICE_PREMIUM_YEARLY,STRIPE_PRICE_MAX_MONTHLY,STRIPE_PRICE_MAX_YEARLY,DEPLOY_SHA
          command_timeout: 45m
          debug: true
          script: |
            set -euo pipefail
            cd ~/vozen-rust-prod
            test -n "$STRIPE_SECRET_KEY"
            test -n "$STRIPE_PUBLISHABLE_KEY"
            test -n "$STRIPE_WEBHOOK_SECRET"
            test -n "$DEPLOY_SHA"

            # Keep payment credentials only in the VPS runtime env. This updates
            # existing keys in place without printing any secret values to logs.
            set_env() {
              key="$1"
              value="$2"
              file=".env.rust.prod"
              tmp="${file}.tmp"
              if [ -f "$file" ]; then
                : > "$tmp"
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in
                    "$key="*) printf '%s=%s\n' "$key" "$value" >> "$tmp" ;;
                    *) printf '%s\n' "$line" >> "$tmp" ;;
                  esac
                done < "$file"
                if ! grep -q "^${key}=" "$file"; then
                  printf '%s=%s\n' "$key" "$value" >> "$tmp"
                fi
              else
                printf '%s=%s\n' "$key" "$value" > "$tmp"
              fi
              chmod 600 "$tmp"
              mv "$tmp" "$file"
            }

            set_env RUST_PAYMENTS_ENABLED true
            set_env PREMIUM_API_ENABLED true
            set_env STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
            set_env STRIPE_PUBLISHABLE_KEY "$STRIPE_PUBLISHABLE_KEY"
            set_env STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
            set_env STRIPE_PRICE_PLUS_MONTHLY "$STRIPE_PRICE_PLUS_MONTHLY"
            set_env STRIPE_PRICE_PLUS_YEARLY "$STRIPE_PRICE_PLUS_YEARLY"
            set_env STRIPE_PRICE_PREMIUM_MONTHLY "$STRIPE_PRICE_PREMIUM_MONTHLY"
            set_env STRIPE_PRICE_PREMIUM_YEARLY "$STRIPE_PRICE_PREMIUM_YEARLY"
            set_env STRIPE_PRICE_MAX_MONTHLY "$STRIPE_PRICE_MAX_MONTHLY"
            set_env STRIPE_PRICE_MAX_YEARLY "$STRIPE_PRICE_MAX_YEARLY"

            # The production clone was originally created as a single-branch
            # checkout. Fetch the production ref and verify the exact SHA tested
            # by CI before changing the checkout.
            git fetch origin +refs/heads/migration/vozen-rust:refs/remotes/origin/migration/vozen-rust
            git cat-file -e "$DEPLOY_SHA^{commit}"
            git merge-base --is-ancestor "$DEPLOY_SHA" origin/migration/vozen-rust
            current_commit="$(git rev-parse HEAD)"
            target_commit="$DEPLOY_SHA"
            if [ "$current_commit" = "$target_commit" ]; then
              docker compose -p vozen-prod -f docker-compose.rust.prod.yml up -d --no-build vozen
              echo "Production already runs $target_commit; runtime env refreshed"
              exit 0
            fi
            if git merge-base --is-ancestor "$target_commit" "$current_commit"; then
              echo "Current checkout $current_commit is newer than requested $target_commit; refusing rollback"
              docker compose -p vozen-prod -f docker-compose.rust.prod.yml up -d --no-build vozen
              exit 0
            fi
            if ! git merge-base --is-ancestor "$current_commit" "$target_commit"; then
              echo "::error::Production checkout and requested SHA diverge"
              exit 1
            fi
            git merge --ff-only "$target_commit"
            bash scripts/deploy-rust-vps.sh
