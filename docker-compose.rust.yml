# Explicit Rust cutover override. The normal `docker compose up` still uses Dockerfile and
# starts Node. Use this file only after the staging runbook's isolation and smoke gates pass.
#
# The service name and `data` volume deliberately stay identical to docker-compose.yml so the
# Rust process can read the existing SQLite/WAL data after Node is stopped. Never run both files
# concurrently with the same Discord token.
services:
  vozen:
    # RUST_ENV_FILE is consumed by the base compose env_file. Leaving it unset keeps
    # `.env` for an intentional, already-reviewed cutover.
    build:
      context: .
      dockerfile: Dockerfile.rust
    image: vozen-rust:staging
    environment:
      # The Rust image embeds the checksum-pinned Linux Piper release. The base compose mount at
      # /opt/piper may contain host/Windows assets, so the Rust runtime deliberately does not use it.
      PIPER_PATH: /usr/local/lib/piper/piper
      # The staging dotenv is also used by the Windows smoke; override its host path inside Linux.
      FFMPEG_PATH: /usr/bin/ffmpeg
      # Relative cache defaults resolve below /app, which is read-only for the runtime user.
      # Keep every synthesis provider's cache on the persistent, writable data volume.
      RUST_VOICE_CACHE_DIR: /data/audio-cache/rust
      RUST_TTS_FILE_CACHE_DIR: /data/audio-cache/rust-file
      RUST_GTTS_CACHE_DIR: /data/audio-cache/rust-gtts
      RUST_NEURAL_CACHE_DIR: /data/audio-cache/rust-neural
      RUST_GCLOUD_CACHE_DIR: /data/audio-cache/rust-gcloud
      RUST_KOKORO_CACHE_DIR: /data/audio-cache/rust-kokoro
      # The Rust image bundles the CPU Kokoro sidecar and its pinned model assets.
      KOKORO_CMD: /app/tools/kokoro-venv/bin/python /app/tools/kokoro_server.py
      KOKORO_LANGS: en,es,fr,hi,it,pt,ja
      # Keep the Rust-owned command fingerprint beside the staging SQLite/WAL volume.
      RUST_COMMANDS_STATE_PATH: /data/commands-state-rust.json
