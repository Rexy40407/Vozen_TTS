[workspace]
members = [
  "crates/vozen-contracts",
  "crates/vozen-core",
  "crates/vozen-store",
  "crates/vozen-api",
  "crates/vozen-discord",
  "crates/vozen-tts",
  "crates/vozen-runtime",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Rexy40407/vozen"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
thiserror = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync", "fs", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.22.0", features = ["v4"] }
hmac = "0.12.1"
sha2 = "0.10.9"
subtle = "2.6.1"
form_urlencoded = "1.2.2"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
songbird = { version = "0.6.0", default-features = false, features = ["gateway", "rustls", "serenity"] }
async-trait = "0.1.91"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.12.3"
time = { version = "0.3.47", features = ["formatting", "parsing", "macros"] }
whatlang = "0.18.0"
unicode-normalization = "0.1.24"
chess = "3.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
