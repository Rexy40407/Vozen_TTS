[workspace]
members = [
  "crates/vozen-contracts",
  "crates/vozen-core",
  "crates/vozen-store",
  "crates/vozen-api",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Rexy40407/vozen"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.22.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
